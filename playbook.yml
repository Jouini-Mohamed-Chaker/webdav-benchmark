---
- name: Configure WebDAV Environment on RHEL VMs
  hosts: all
  become: yes
  vars:
    numa_subnet_prefix: "192.168.95"
    # Combined queue count to request - matches Proxmox-side Multiqueue setting.
    # All three VMs (client/proxy/webdav) are now 32 vCPU / 4 sockets with
    # Multiqueue=32 set in Proxmox, so the guest side needs to match.
    target_queues: 32
  tasks:
    - name: Install common packages (Firewalld, SELinux, numactl, sysstat)
      dnf:
        name:
          - firewalld
          - policycoreutils-python-utils
          - numactl
          - sysstat
        state: present

    - name: Install Nginx (proxy role only)
      dnf:
        name: nginx
        state: present
      when: "'nginx_proxy' in group_names"

    - name: Install Apache httpd + mod_dav (webdav backend only)
      dnf:
        name:
          - httpd
          - mod_dav
        state: present
      when: "'webdav_backend' in group_names"

    - name: Ensure Firewalld is running
      systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Allow Port 8080 in Firewalld
      firewalld:
        port: 8080/tcp
        permanent: yes
        state: enabled
        immediate: yes

    # -----------------------------------------------------------
    # Detect which NIC sits on the NUMA-enabled 192.168.95.0/24 net
    # -----------------------------------------------------------
    - name: Detect NUMA-net interface from facts
      set_fact:
        numa_iface: "{{ item }}"
      loop: "{{ ansible_facts.interfaces }}"
      when:
        - numa_iface is not defined
        - ansible_facts[item].ipv4 is defined
        - ansible_facts[item].ipv4.address is defined
        - ansible_facts[item].ipv4.address.split('.')[0:3] | join('.') == numa_subnet_prefix

    - name: Show detected NUMA interface
      debug:
        msg: "NUMA-net interface on {{ inventory_hostname }} is {{ numa_iface | default('NOT FOUND') }}"

    # NOTE: virtio NICs (ens19 here) expose no /sys numa_node and their
    # queue interrupts (virtioN-input.X/output.X) are already spread
    # across per-vCPU IRQs and NUMA-local by default via irqbalance -
    # confirmed via /proc/interrupts + lscpu -p=CPU,NODE. No manual
    # pinning needed/possible here, so that step has been removed.

    # -----------------------------------------------------------
    # Multiqueue: Proxmox-side Multiqueue=32 only raises the ceiling -
    # the guest still has to actually turn the queues on, and a plain
    # `ethtool -L` doesn't survive a reboot. RHEL hosts are on
    # NetworkManager, so we persist it into the connection profile
    # (nmcli), which re-applies ethtool.channels-combined on every
    # activation instead of relying on a one-shot command.
    # -----------------------------------------------------------
    - name: Get active NetworkManager connection name for NUMA interface
      command: nmcli -t -f NAME,DEVICE connection show --active
      register: nm_connections
      changed_when: false
      when: numa_iface is defined

    - name: Identify NM connection name bound to the NUMA interface
      set_fact:
        numa_nm_conn: "{{ item.split(':')[0] }}"
      loop: "{{ nm_connections.stdout_lines }}"
      when:
        - numa_iface is defined
        - nm_connections.stdout_lines is defined
        - item.endswith(':' + numa_iface)

    - name: Check current combined channel count
      command: ethtool -l {{ numa_iface }}
      register: ethtool_channels_current
      changed_when: false
      when: numa_iface is defined

    - name: Set combined queue count persistently via NetworkManager profile
      command: >
        nmcli connection modify "{{ numa_nm_conn }}"
        ethtool.channels-combined {{ target_queues }}
      when:
        - numa_iface is defined
        - numa_nm_conn is defined
      notify: Reactivate NUMA NIC connection

    # -----------------------------------------------------------
    # sysctl + ulimit tuning (network + fd limits for high-concurrency)
    # -----------------------------------------------------------
    - name: Deploy sysctl tuning
      template:
        src: templates/99-webdav-bench.conf.j2
        dest: /etc/sysctl.d/99-webdav-bench.conf
      notify: Reload sysctl

    - name: Raise system-wide open file limits (limits.conf)
      blockinfile:
        path: /etc/security/limits.conf
        marker: "# {mark} ANSIBLE MANAGED - webdav bench"
        block: |
          root soft nofile 1048576
          root hard nofile 1048576
          nginx soft nofile 1048576
          nginx hard nofile 1048576
          apache soft nofile 1048576
          apache hard nofile 1048576
          * soft nofile 1048576
          * hard nofile 1048576

    - name: Create systemd override dir for nginx
      file:
        path: /etc/systemd/system/nginx.service.d
        state: directory
        mode: '0755'
      when: "'nginx_proxy' in group_names"

    - name: Deploy nginx systemd limit override
      template:
        src: templates/nginx_limits_override.conf.j2
        dest: /etc/systemd/system/nginx.service.d/limits.conf
      notify: Reload systemd
      when: "'nginx_proxy' in group_names"

    - name: Create systemd override dir for httpd
      file:
        path: /etc/systemd/system/httpd.service.d
        state: directory
        mode: '0755'
      when: "'webdav_backend' in group_names"

    - name: Deploy httpd systemd limit override
      template:
        src: templates/nginx_limits_override.conf.j2
        dest: /etc/systemd/system/httpd.service.d/limits.conf
      notify: Reload systemd
      when: "'webdav_backend' in group_names"

    # -----------------------------------------------------------
    # nginx.conf is fully managed here - single source of truth,
    # safe to re-run (template is idempotent: no-op if unchanged)
    # Proxy only now - the backend runs httpd, not nginx.
    # -----------------------------------------------------------
    - name: Deploy managed nginx.conf
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Restart Nginx
      when: "'nginx_proxy' in group_names"

  handlers:
    - name: Reactivate NUMA NIC connection
      command: nmcli connection up "{{ numa_nm_conn }}"

    - name: Reload sysctl
      command: sysctl --system

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Nginx
      systemd:
        name: nginx
        daemon_reload: yes
        state: restarted
        enabled: yes

# -----------------------------------------------------------
# Setup WebDAV Backend Server
# -----------------------------------------------------------
- name: Configure WebDAV Backend
  hosts: webdav_backend
  become: yes
  vars:
    webdav_disk: /dev/sdb
    webdav_disk_mount: /data/webdav
    use_tmpfs: true
    webdav_tmpfs_mount: /mnt/webdav_ram
    webdav_tmpfs_size: 90%
    webdav_serve_path: "{{ webdav_tmpfs_mount if use_tmpfs else webdav_disk_mount }}"
    # ServerLimit * ThreadsPerChild must be >= MaxRequestWorkers.
    # 16 * 64 = 1024, well above anything the benchmark throws at it (max 128
    # concurrent), so worker-pool exhaustion is ruled out as a variable.
    httpd_server_limit: 16
    httpd_threads_per_child: 64
    httpd_min_spare_threads: 75
    httpd_max_spare_threads: 250
    httpd_max_request_workers: 1024
  tasks:
    # --- Remove nginx from this box - it used to serve WebDAV here but
    # httpd/mod_dav has replaced it. Must be stopped before httpd can
    # bind port 8080, and left running would just be a stale, unmanaged
    # process holding the port on every future run.
    - name: Stop and disable nginx if present (superseded by httpd here)
      systemd:
        name: nginx
        state: stopped
        enabled: no
      failed_when: false

    - name: Remove nginx package from webdav backend
      dnf:
        name: nginx
        state: absent

    - name: Clear any stale failed state on httpd unit
      command: systemctl reset-failed httpd
      changed_when: false
      failed_when: false

    - name: Ensure SELinux allows httpd to bind port 8080
      seport:
        ports: 8080
        proto: tcp
        setype: http_port_t
        state: present

    # --- Real disk, kept mounted/persisted for later non-benchmark use ---
    - name: Get UUID of the webdav disk
      command: blkid -s UUID -o value {{ webdav_disk }}
      register: webdav_uuid
      changed_when: false

    - name: Ensure disk mount point exists
      file:
        path: "{{ webdav_disk_mount }}"
        state: directory
        owner: apache
        group: apache
        mode: '0775'

    - name: Persist xfs mount in fstab (by UUID) and mount now
      mount:
        path: "{{ webdav_disk_mount }}"
        src: "UUID={{ webdav_uuid.stdout }}"
        fstype: xfs
        opts: defaults,noatime,nodiratime,largeio,inode64
        state: mounted

    - name: Set SELinux permissions for disk WebDAV directory
      sefcontext:
        target: '{{ webdav_disk_mount }}(/.*)?'
        setype: httpd_sys_rw_content_t
        state: present

    - name: Set SCSI disk scheduler to none (best for virtio-scsi)
      shell: |
        DEV=$(basename {{ webdav_disk }})
        echo none > /sys/block/$DEV/queue/scheduler 2>/dev/null || true
      changed_when: true

    - name: Make disk scheduler choice persistent via udev rule
      copy:
        dest: /etc/udev/rules.d/60-webdav-disk-scheduler.rules
        content: |
          ACTION=="add|change", KERNEL=="sdb", ATTR{queue/scheduler}="none"

    # --- tmpfs, used to serve WebDAV so the disk isn't the bottleneck ---
    - name: Ensure tmpfs mount point exists
      file:
        path: "{{ webdav_tmpfs_mount }}"
        state: directory
        owner: apache
        group: apache
        mode: '0775'
      when: use_tmpfs

    - name: Persist tmpfs mount in fstab and mount now
      mount:
        path: "{{ webdav_tmpfs_mount }}"
        src: tmpfs
        fstype: tmpfs
        opts: "size={{ webdav_tmpfs_size }},uid=apache,gid=apache,mode=0775"
        state: mounted
      when: use_tmpfs

    - name: Set SELinux permissions for tmpfs WebDAV directory
      sefcontext:
        target: '{{ webdav_tmpfs_mount }}(/.*)?'
        setype: httpd_sys_rw_content_t
        state: present
      when: use_tmpfs

    - name: Set SELinux permissions for tmp upload dir
      sefcontext:
        target: '{{ webdav_serve_path }}/.uploadtmp(/.*)?'
        setype: httpd_sys_rw_content_t
        state: present

    - name: Ensure tmp upload dir exists INSIDE serve path (same fs - cheap rename, no cross-device copy)
      file:
        path: "{{ webdav_serve_path }}/.uploadtmp"
        state: directory
        owner: apache
        group: apache
        mode: '0775'

    - name: Apply SELinux context to serve + tmp paths
      command: restorecon -R {{ webdav_serve_path }}
      changed_when: false

    - name: Ensure DAV lock db directory exists
      file:
        path: /var/lib/dav
        state: directory
        owner: apache
        group: apache
        mode: '0770'

    - name: Allow httpd to write to filesystem (SELinux boolean for DAV writes)
      seboolean:
        name: httpd_unified
        state: yes
        persistent: yes

    - name: Deploy explicit MPM event tuning (worker/thread limits)
      template:
        src: templates/mpm_tuning.conf.j2
        dest: /etc/httpd/conf.d/00-mpm-tuning.conf
      notify: Restart httpd

    - name: Deploy Apache WebDAV vhost configuration
      template:
        src: templates/webdav.conf.j2
        dest: /etc/httpd/conf.d/webdav.conf
      notify: Restart httpd

    - name: Ensure default httpd welcome page config is disabled
      file:
        path: /etc/httpd/conf.d/welcome.conf
        state: absent
      notify: Restart httpd

    # Explicit, unconditional check - the template/handler above only fires
    # on config *changes*, so on a re-run with no config diff (e.g. right
    # after removing nginx) httpd could otherwise stay in a stale failed
    # state indefinitely. This guarantees it's actually up every run.
    - name: Ensure httpd is actually running
      systemd:
        name: httpd
        state: started
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: Restart httpd
      systemd:
        name: httpd
        daemon_reload: yes
        state: restarted
        enabled: yes

# -----------------------------------------------------------
# Setup Nginx Reverse Proxy
# -----------------------------------------------------------
- name: Configure Nginx Reverse Proxy
  hosts: nginx_proxy
  become: yes
  tasks:
    - name: Allow Nginx to connect to network/backend (SELinux boolean)
      seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes

    - name: Deploy Proxy Nginx configuration
      template:
        src: templates/proxy.conf.j2
        dest: /etc/nginx/conf.d/proxy.conf
      notify: Restart Nginx

    - name: Ensure default server configuration is removed
      file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      systemd:
        name: nginx
        daemon_reload: yes
        state: restarted
        enabled: yes

# -----------------------------------------------------------
# Configure NIC multiqueue on the Ubuntu client (control node)
#
# Ubuntu 24's netplan has no ethtool.channels-combined equivalent to
# NetworkManager's, so persistence here is a systemd oneshot unit tied
# to the NIC device via BindsTo, instead of a one-off `ethtool -L` that
# would silently revert on next boot/NIC reinit.
# -----------------------------------------------------------
- name: Configure NUMA-net NIC multiqueue on Ubuntu client
  hosts: localhost
  connection: local
  become: yes
  vars:
    numa_subnet_prefix: "192.168.95"
    target_queues: 32
  tasks:
    - name: Detect NUMA-net interface from facts
      set_fact:
        numa_iface: "{{ item }}"
      loop: "{{ ansible_facts.interfaces }}"
      when:
        - numa_iface is not defined
        - ansible_facts[item].ipv4 is defined
        - ansible_facts[item].ipv4.address is defined
        - ansible_facts[item].ipv4.address.split('.')[0:3] | join('.') == numa_subnet_prefix

    - name: Show detected NUMA interface on client
      debug:
        msg: "NUMA-net interface on client is {{ numa_iface | default('NOT FOUND') }}"

    - name: Check current combined channel count on client
      command: ethtool -l {{ numa_iface }}
      register: ethtool_channels_current
      changed_when: false
      when: numa_iface is defined

    - name: Deploy systemd unit to set multiqueue on NIC bring-up
      template:
        src: templates/nic-multiqueue.service.j2
        dest: /etc/systemd/system/nic-multiqueue@.service
      when: numa_iface is defined
      notify: Reload systemd on client

    - name: Enable and start multiqueue unit for detected interface
      systemd:
        name: "nic-multiqueue@{{ numa_iface }}.service"
        enabled: yes
        state: started
        daemon_reload: yes
      when: numa_iface is defined

  handlers:
    - name: Reload systemd on client
      systemd:
        daemon_reload: yes

# -----------------------------------------------------------
# Benchmarking is NOT run through Ansible anymore.
# This playbook only provisions the environment (packages, NIC/sysctl
# tuning, nginx proxy, apache/mod_dav backend). Once a run completes,
# benchmark manually from the Ubuntu client with:
#
#   ./benchmark.sh <proxy-ip> 8080 <file_size_mb> <parallel_file_mb> <repeats>
#   ./rclone_benchmark.sh webdav_proxy <file_size_mb> <repeats>
#   ./rclone_benchmark.sh webdav_direct <file_size_mb> <repeats>   # bypass proxy
#
# This keeps iteration fast (no full playbook run needed per test) and
# keeps the provisioning code idempotent/safe to re-run independently.
# -----------------------------------------------------------