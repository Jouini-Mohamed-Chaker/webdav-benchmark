# rclone remote pointing at the WebDAV endpoint.
# By default this points at the PROXY (matches your normal traffic path).
# For the "direct vs proxy" comparison later, duplicate this remote with
# the backend IP instead.
#
# Install rclone on the Ubuntu client:
#   curl https://rclone.org/install.sh | sudo bash
#
# Save this file as ~/.config/rclone/rclone.conf (or merge into it),

[webdav_proxy]
type = webdav
url = http://192.168.95.1:8080/dav
vendor = other
pacer_min_sleep = 0ms

[webdav_direct]
type = webdav
url = http://192.168.95.2:8080/dav
vendor = other
pacer_min_sleep = 0ms
